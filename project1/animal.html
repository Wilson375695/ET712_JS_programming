<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Sounds</title>
    <link rel="stylesheet" href="styleproject1.css">
</head>
<body data-page="animal">
    <div class="game-wrap">
        <h1>Animal Sounds</h1>
        <p class="subtitle">Click each animal to hear its sound.</p>

        <div class="animal-grid">
            <div class="animal-card" data-name="Cat" data-sound="meow">
                <img class="animal-photo" src="image/cat.jpeg" alt="Cat">
                <div class="animal-name">Cat</div>
            </div>

            <div class="animal-card" data-name="Dog" data-sound="woof">
                <img class="animal-photo" src="image/dog.jpeg" alt="Dog">
                <div class="animal-name">Dog</div>
            </div>

            <div class="animal-card" data-name="Cow" data-sound="moo">
                <img class="animal-photo" src="image/cow.jpeg" alt="Cow">
                <div class="animal-name">Cow</div>
            </div>

            <div class="animal-card" data-name="Duck" data-sound="quack">
                <img class="animal-photo" src="image/duck.jpeg" alt="Duck">
                <div class="animal-name">Duck</div>
            </div>

            <div class="animal-card" data-name="Lion" data-sound="roar">
                <img class="animal-photo" src="image/lion.jpeg" alt="Lion">
                <div class="animal-name">Lion</div>
            </div>

            <div class="animal-card" data-name="Tiger" data-sound="growl">
                <img class="animal-photo" src="image/tiger.jpeg" alt="Tiger">
                <div class="animal-name">Tiger</div>
            </div>

            <div class="animal-card" data-name="Bear" data-sound="grrr">
                <img class="animal-photo" src="image/bear.jpeg" alt="Bear">
                <div class="animal-name">Bear</div>
            </div>

            <div class="animal-card" data-name="Panda" data-sound="panda">
                <img class="animal-photo" src="image/panda.jpeg" alt="Panda">
                <div class="animal-name">Panda</div>
            </div>

            <div class="animal-card" data-name="Elephant" data-sound="trumpet">
                <img class="animal-photo" src="image/elephant.jpeg" alt="Elephant">
                <div class="animal-name">Elephant</div>
            </div>

            <div class="animal-card" data-name="Zebra" data-sound="neigh">
                <img class="animal-photo" src="image/zebra.jpeg" alt="Zebra">
                <div class="animal-name">Zebra</div>
            </div>
        </div>

        <div class="controls">
            <a class="home-btn" href="project1.html">Back to Home</a>
        </div>
    </div>

    <script src="scriptproject1.js"></script>
</body>
</html>
