<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Match</title>
    <link rel="stylesheet" href="styleproject1.css">
</head>
<body data-page="shape">
    <div class="game-wrap">
        <h1>Shape and Name Match</h1>
        <p class="subtitle">Click a shape, then click the matching name.</p>

        <div class="shape-game">
            <div class="shape-column" id="shapeColumn"></div>

            <svg class="connector-layer" aria-hidden="true"></svg>

            <div class="name-column" id="nameColumn"></div>
            <span class="shape hexagon"></span>
        </div>

        <div class="controls">
            <a class="home-btn" href="project1.html">Back to Home</a>
            <button class="home-btn reset-btn" type="button" id="resetGame">Reset</button>
        </div>
    </div>

    <script src="scriptproject1.js"></script>
</body>
</html>
