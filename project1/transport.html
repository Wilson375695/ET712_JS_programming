<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport Match</title>
    <link rel="stylesheet" href="styleproject1.css">
</head>
<body data-page="transport">
    <div class="game-wrap">
        <h1>Transport Match</h1>
        <p class="subtitle">Match each transport picture to its name.</p>

        <div class="stats">
            <span>Matches: <strong id="matches">0</strong>/4</span>
            <span>Turns: <strong id="turns">0</strong></span>
        </div>

        <div class="board" id="board"></div>

        <div class="controls">
            <a class="home-btn" href="project1.html">Back to Home</a>
            <button class="home-btn reset-btn" type="button" id="resetGame">Reset</button>
        </div>
    </div>

    <script src="scriptproject1.js"></script>
</body>
</html>
